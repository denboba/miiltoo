<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="miiltoo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>miiltoo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API -->
  <!-- 
    Note: Replace YOUR_WEB_API_KEY with your actual Google Maps JavaScript API key
    or set the GOOGLE_MAPS_WEB_API_KEY environment variable during build.
    Without a valid API key, you'll see "InvalidKeyMapError" in the console.
    Get your API key from: https://console.cloud.google.com/
    Enable: Maps JavaScript API
  -->
  <script>
    // Try to load API key from environment or use placeholder
    var googleMapsApiKey = 'YOUR_WEB_API_KEY';
    // Check if we're in development and have a config file
    if (typeof GOOGLE_MAPS_CONFIG !== 'undefined' && GOOGLE_MAPS_CONFIG.apiKey) {
      googleMapsApiKey = GOOGLE_MAPS_CONFIG.apiKey;
    }
    // Load Google Maps with the API key
    if (googleMapsApiKey && googleMapsApiKey !== 'YOUR_WEB_API_KEY') {
      document.write('<script src="https://maps.googleapis.com/maps/api/js?key=' + googleMapsApiKey + '"><\/script>');
    } else {
      console.warn('Google Maps API key not configured. Map features will not work. See web/index.html for instructions.');
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
